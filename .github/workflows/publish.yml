name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without a leading v
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Verify release
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Packages
    needs: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve release version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: echo "RELEASE_VERSION=${RAW_VERSION#v}" >> "$GITHUB_ENV"
      - name: Publish KMP and JVM artifacts
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
