name: Build

on:
  workflow_call:
  pull_request:
    branches: [master]

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Gradle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

  jvm:
    name: JVM 17
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test KMP JVM core
        run: ./gradlew :blueluak-core:jvmTest --no-daemon --stacktrace
      - name: Build JVM integrations
        run: ./gradlew :blueluak-jvm:build --no-daemon --stacktrace

  web:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: JavaScript
            task: jsNodeTest
          - target: Wasm
            task: wasmJsNodeTest
          - target: WasmWasi
            task: wasmWasiNodeTest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run ${{ matrix.target }} tests
        run: ./gradlew :blueluak-core:${{ matrix.task }} --no-daemon --stacktrace

  native:
    name: Native ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux x64
            os: ubuntu-latest
            task: linuxX64Test
          - target: Windows x64
            os: windows-latest
            task: mingwX64Test
          - target: macOS x64
            os: macos-15-intel
            task: macosX64Test
          - target: macOS ARM64
            os: macos-15
            task: macosArm64Test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run ${{ matrix.target }} tests
        run: ./gradlew :blueluak-core:${{ matrix.task }} --no-daemon --stacktrace

  publication:
    name: Verify publications
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish all variants to Maven Local
        run: ./gradlew publishToMavenLocal --no-daemon --stacktrace
