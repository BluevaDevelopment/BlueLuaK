name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    uses: ./.github/workflows/build.yml

  release:
    name: Cut release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # year.build, resetting the build number when the year changes.
      - name: Bump version
        id: version
        run: |
          CURRENT_YEAR="$(date +%y)"
          YEAR="$CURRENT_YEAR"
          BUILD=0
          if [[ -f build.properties ]]; then
            source build.properties
            YEAR="${year:-$CURRENT_YEAR}"
            BUILD="${build:-0}"
          fi
          if [[ "$YEAR" != "$CURRENT_YEAR" ]]; then
            YEAR="$CURRENT_YEAR"
            BUILD=0
          fi
          BUILD=$((BUILD + 1))
          REVISION="$YEAR.$BUILD"
          printf 'year=%s\nbuild=%s\n' "$YEAR" "$BUILD" > build.properties
          sed -i "s|version-[^-]*-blue|version-$REVISION-blue|" README.md
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "Releasing BlueLuaK $REVISION"

      # Pushes made with GITHUB_TOKEN don't retrigger this workflow, so
      # [skip ci] is just extra insurance.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.properties README.md
          git commit -m "build(release): bump version to ${{ steps.version.outputs.revision }} [skip ci]"
          git push

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.revision }}"
          git push origin "v${{ steps.version.outputs.revision }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.revision }}" --title "BlueLuaK ${{ steps.version.outputs.revision }}" --generate-notes

  publish:
    name: Publish GitHub Packages
    needs: release
    runs-on: macos-15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.revision }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish KMP and JVM artifacts
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --stacktrace
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.revision }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
